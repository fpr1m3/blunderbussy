include:
    - infrastructure/faraday/docker-compose.faraday.yml

services:
    gluetun:
        image: docker.io/qmcgaw/gluetun:v3.41.0
        container_name: gluetun
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        volumes:
            - ./infrastructure/gluetun:/gluetun
            - ./infrastructure/gluetun/post-rules.txt:/iptables/post-rules.txt:ro
        ports:
            - "9998:9998"  # pwncat-mcp HTTP server (LHOST queries, health)
            - "9997:9997"  # msf-bridge HTTP API
            - "4444:4444"  # MSF default payload callback
            - "4445:4445"  # MSF secondary payload callback
            - "31337:31337" # Sliver multiplexer port
        environment:
            - VPN_SERVICE_PROVIDER=custom
            - VPN_TYPE=openvpn
            - OPENVPN_CUSTOM_CONFIG=/gluetun/htb.ovpn
            # Allow DNS (1.1.1.1) outside VPN for health checks - acceptable for HTB
            - FIREWALL_OUTBOUND_SUBNETS=172.19.0.0/16,172.17.0.0/16,1.1.1.1/32
            # DNS settings
            - DNS_SERVER=off
            - DNS_KEEP_NAMESERVER=on
            - PUBLICIP_ENABLED=no
            - VERSION_INFORMATION=off
            - UPDATER_PERIOD=0
            # Health check config - use HTB VPN gateway (only responds to ICMP)
            - HEALTH_TARGET_ADDRESSES=38.46.226.72:1337
            - HEALTH_ICMP_TARGET_IPS=10.10.14.1
            - HEALTH_RESTART_VPN=off
            # Split tunnel: post-rules.txt configures forwarding for dame
        sysctls:
            - net.core.somaxconn=1024
            - net.ipv4.ip_forward=1
        restart: always

    # Enrichment Pipeline - Stream B
    # Watches for raw scans and processes through enrichment pipeline
    enrichment:
        build:
            context: ./infrastructure
            dockerfile: enrichment/Dockerfile
        container_name: enrichment
        user: root  # Need root for volume write access in rootless podman
        volumes:
            # Shared artifacts volume
            - artifacts:/artifacts
            # CVE cache persistence
            - enrichment-cache:/artifacts/cache
            # Gemini CLI auth persistence (OAuth tokens)
            - enrichment-gemini:/root/.gemini
        environment:
            - PYTHONUNBUFFERED=1
            - LOG_LEVEL=INFO
            - MANIFEST_PATH=/artifacts/manifest.yaml
            # Faraday connection
            - FARADAY_URL=http://faraday-server:5985
            - FARADAY_USER=${FARADAY_USER:-faraday}
            - FARADAY_PASSWORD=${FARADAY_DB_PASSWORD:-changeme}
            - FARADAY_WORKSPACE=${TARGET_NAME:-pentest}
            # Optional: NVD API key for faster CVE lookups
            - NVD_API_KEY=${NVD_API_KEY:-}
            # Force file-based token storage for Gemini CLI (no keychain in container)
            - GEMINI_FORCE_FILE_STORAGE=true
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 15s
        restart: unless-stopped
        depends_on:
            - gluetun
            - faraday-server

    # ═══════════════════════════════════════════════════════════════════════════
    # Stream E - Tool Containers & MCP Integration
    # ═══════════════════════════════════════════════════════════════════════════
    #
    # Architecture:
    #   metatool-ai/metamcp (aggregator) --> MSF MCP, Sliver MCP, HTB MCP, HexStrike
    #
    # MetaMCP runs separately via:
    #   podman-compose -f infrastructure/metamcp-real/docker-compose.metamcp.yml up -d
    #
    # See: infrastructure/metamcp-real/README.md for setup instructions
    # ═══════════════════════════════════════════════════════════════════════════

    # MSF MCP Server (Python MCP wrapper for msf-bridge)
    # Backend for MetaMCP - provides Metasploit tools via MCP protocol
    # Connects to msf-bridge HTTP API (not directly to msfrpcd)
    msf-mcp:
        build:
            context: ./infrastructure/PrEP/servers
            dockerfile: Dockerfile.msf
        container_name: msf-mcp
        network_mode: "service:gluetun"  # Same network to access bridge on localhost
        environment:
            - PYTHONUNBUFFERED=1
            - MSF_BRIDGE_URL=http://127.0.0.1:9997
        healthcheck:
            test: ["CMD", "python3", "-c", "print('healthy')"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        restart: unless-stopped
        depends_on:
            msf-bridge:
                condition: service_healthy

    # Sliver MCP Server (Python gRPC wrapper for Sliver)
    # Backend for MetaMCP - provides Sliver C2 tools via MCP protocol
    # Connects to sliver daemon via gRPC
    sliver-mcp:
        build:
            context: ./infrastructure/PrEP/servers
            dockerfile: Dockerfile.sliver
        container_name: sliver-mcp
        user: root  # Need root for volume write access in rootless podman
        network_mode: "service:gluetun"  # Same network to access sliver on localhost
        volumes:
            - sliver-configs:/root/.sliver-client:ro  # Read operator config
            - artifacts:/artifacts  # For implant storage
        environment:
            - PYTHONUNBUFFERED=1
            - SLIVER_CONFIG=/root/.sliver-client/configs/operator.cfg
        healthcheck:
            test: ["CMD", "python3", "-c", "print('healthy')"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        restart: unless-stopped
        depends_on:
            sliver:
                condition: service_healthy

    # Pwncat MCP Server (Python post-exploitation framework)
    # Backend for MetaMCP - provides pwncat-cs tools via MCP protocol
    # Uses VPN network for reverse shell connections from HTB targets
    pwncat-mcp:
        build:
            context: ./infrastructure/PrEP/servers
            dockerfile: Dockerfile.pwncat
        container_name: pwncat-mcp
        network_mode: "service:gluetun" # Needs VPN for reverse shells
        volumes:
            - artifacts:/artifacts # For file transfers
        environment:
            - PYTHONUNBUFFERED=1
        healthcheck:
            test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        restart: unless-stopped
        depends_on:
            - gluetun

    # HexStrike-AI - Offensive Security Tools Container
    # Provides 150+ security tools (nmap, nuclei, gobuster, etc.)
    # Requires privileged mode for raw socket operations
    hexstrike-recon:
        build:
            context: ./infrastructure/hexstrike-recon
            dockerfile: Dockerfile
        container_name: hexstrike-recon
        cap_add:
            - NET_ADMIN    # Network configuration
            - NET_RAW      # Raw sockets (nmap SYN scans, masscan)
            - SYS_PTRACE   # For gdb debugging
        security_opt:
            - seccomp:unconfined  # Required for some low-level tools
        network_mode: "service:gluetun"
        volumes:
            - artifacts:/artifacts
        environment:
            - PYTHONUNBUFFERED=1
            - HEXSTRIKE_HOST=0.0.0.0
            - HEXSTRIKE_PORT=8888
            # HTB target vhost resolution (set via .env or CLI)
            # Example: HTB_TARGET=10.129.2.163 HTB_HOSTNAME="conversor.htb api.conversor.htb"
            - HTB_TARGET=${HTB_TARGET:-}
            - HTB_HOSTNAME=${HTB_HOSTNAME:-}
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        restart: unless-stopped
        depends_on:
            - gluetun

    # ═══════════════════════════════════════════════════════════════════════════
    # Stream D - Skill Vector DB
    # ═══════════════════════════════════════════════════════════════════════════
    #
    # Qdrant vector database for Dame's technique library
    # Query via REST: http://localhost:6333
    # Dashboard: http://localhost:6333/dashboard
    #
    # Index skills: python infrastructure/scripts/index_skills.py
    # Query: curl http://localhost:6333/collections/skills/points/search -d '{"vector": [...], "limit": 5}'
    # ═══════════════════════════════════════════════════════════════════════════

    qdrant:
        image: docker.io/qdrant/qdrant:v1.16.3
        container_name: qdrant
        ports:
            - "6333:6333" # REST API
            - "6334:6334" # gRPC (optional)
        volumes:
            - qdrant-data:/qdrant/storage
        environment:
            - QDRANT__SERVICE__GRPC_PORT=6334
        restart: unless-stopped

    # ═══════════════════════════════════════════════════════════════════════════
    # Stream F - Dame (gemini-cli with tmux session management)
    # ═══════════════════════════════════════════════════════════════════════════
    #
    # Attach: podman exec -it dame tmux attach -t dame
    # Detach: Ctrl+A, D
    #
    # Split Tunnel Architecture:
    #   - HTB subnets (10.10.0.0/16, 10.129.0.0/16) → routed via gluetun VPN
    #   - Everything else (OAuth, web, APIs) → direct internet
    #   - Routing is transparent - dame just runs commands normally
    # ═══════════════════════════════════════════════════════════════════════════

    dame:
        image: localhost/dame:linux
        container_name: dame
        hostname: dame
        # Split tunnel: HTB subnets via gluetun VPN, everything else direct
        # NET_ADMIN: for split tunnel routing
        # NET_RAW: for nmap raw socket operations
        cap_add:
            - NET_ADMIN
            - NET_RAW
        volumes:
            # Host auth (read-only) - for initial setup reference
            - ~/.gemini:/root/.gemini-host:ro
            # Persistent gemini config (stores OAuth tokens)
            - dame-gemini:/root/.gemini
            # Opulence extension
            - ./infrastructure/PrEP:/ext/opulence:ro
            # Artifacts for CAS access
            - artifacts:/artifacts
        environment:
            - TERM=xterm-256color
            # Force file-based token storage (no keychain in container)
            - GEMINI_FORCE_FILE_STORAGE=true
            # HTB subnets to route through VPN (comma-separated CIDR)
            - HTB_SUBNETS=10.10.0.0/16,10.129.0.0/16
        stdin_open: true
        tty: true
        restart: unless-stopped
        depends_on:
            - gluetun
            - qdrant

    # ═══════════════════════════════════════════════════════════════════════════
    # Backend Services - C2 Frameworks
    # ═══════════════════════════════════════════════════════════════════════════

    # Metasploit Framework with msfrpcd
    # Routes through gluetun VPN for HTB payload callbacks
    msf:
        image: docker.io/metasploitframework/metasploit-framework:latest
        container_name: msf
        privileged: true  # Required: CachyOS kernel blocks ruby exec without this
        network_mode: "service:gluetun"
        volumes:
            - msf-data:/root/.msf4
            - artifacts:/artifacts
        environment:
            - MSF_RPC_HOST=0.0.0.0
            - MSF_RPC_PORT=55553
            - MSF_RPC_USER=${MSF_USER:-msf}
            - MSF_RPC_PASS=${MSF_PASS:?MSF_PASS required in .env}
        command: >
            ./msfrpcd -U ${MSF_USER:-msf} -P ${MSF_PASS} -S -a 0.0.0.0 -p 55553 -f
        healthcheck:
            test: ["CMD-SHELL", "curl --connect-timeout 2 -s -o /dev/null http://localhost:55553/; [ $? -ne 7 ]"]
            interval: 30s
            timeout: 10s
            start_period: 90s
            retries: 5
        restart: unless-stopped
        depends_on:
            - gluetun

    # MSF Bridge - HTTP API for msfrpcd
    # Shares gluetun network to access msf on localhost:55553
    # Port 9997 exposed through gluetun
    msf-bridge:
        build:
            context: ./infrastructure/PrEP/servers/msf-bridge
            dockerfile: Dockerfile
        container_name: msf-bridge
        network_mode: "service:gluetun"
        environment:
            - MSF_HOST=127.0.0.1
            - MSF_PORT=55553
            - MSF_USER=${MSF_USER:-msf}
            - MSF_PASS=${MSF_PASS:?MSF_PASS required in .env}
            - BRIDGE_PORT=9997
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9997/health"]
            interval: 30s
            timeout: 5s
            start_period: 15s
            retries: 3
        restart: unless-stopped
        depends_on:
            msf:
                condition: service_healthy

    # Sliver C2 Server
    # Routes through gluetun VPN for HTB implant callbacks
    # Built from source - BishopFox doesn't publish Docker images
    sliver:
        build:
            context: https://github.com/BishopFox/sliver.git
            target: production-slim
        container_name: sliver
        network_mode: "service:gluetun"
        volumes:
            - sliver-data:/home/sliver/.sliver
            - sliver-configs:/home/sliver/.sliver-client
            - artifacts:/artifacts
        command: ["daemon"]
        healthcheck:
            test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/31337'"]
            interval: 30s
            timeout: 10s
            start_period: 60s
            retries: 5
        restart: unless-stopped
        depends_on:
            - gluetun

    # ==========================================================================
    # Test Profile — Local vulnerable target for E2E testing without VPN
    # Usage: podman-compose --profile test up -d mock-target
    # ==========================================================================
    mock-target:
        image: docker.io/vulhub/httpd:2.4.49
        profiles: ["test"]
        container_name: mock-target
        networks:
            - test-net

    hexstrike-test:
        extends:
            service: hexstrike-recon
        profiles: ["test"]
        container_name: hexstrike-test
        environment:
            - TARGET=mock-target
        networks:
            - test-net
        depends_on:
            - mock-target

volumes:
    # Shared artifacts volume for scan data and CAS documents
    artifacts:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ${ARTIFACTS_PATH:-./artifacts}
    # CVE enrichment cache
    enrichment-cache:
    # Enrichment container gemini-cli config (persists OAuth tokens)
    enrichment-gemini:
    # Qdrant vector DB storage
    qdrant-data:
    # Dame gemini-cli config (persists OAuth tokens)
    dame-gemini:
    # Metasploit Framework data (modules, loot, sessions)
    msf-data:
    # Sliver C2 server data
    sliver-data:
    # Sliver client configs (operator certs)
    sliver-configs:

networks:
    default:
        name: opulence_network
    test-net:
        name: test-net
        driver: bridge
