services:
  eval-target:
    image: docker.io/vulhub/bind:9.10.3
    container_name: eval-dns-zone-transfer
    ports:
      - "5353:53/tcp"
      - "5353:53/udp"
    volumes:
      - ./named.conf.local:/etc/bind/named.conf.local:ro
      - ./vulhub.db:/etc/bind/vulhub.db:ro
    networks:
      - eval-net

networks:
  eval-net:
    driver: bridge
