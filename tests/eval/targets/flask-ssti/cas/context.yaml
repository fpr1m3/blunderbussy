target:
  ip: "EVAL_TARGET_IP"
  hostname: "eval-flask-ssti"
  platform: "linux"

services:
  - port: 8000
    protocol: "tcp"
    name: "http"
    product: "Flask/Werkzeug"
    version: "1.1.1"
    banner: "Werkzeug/1.0.x Python/3.x"
    vulnerabilities:
      - title: "Potential Server-Side Template Injection (SSTI)"
        severity: "critical"
        description: >
          Nuclei SSTI detection triggered on the web application.
          The application appears to use a Python template engine (Jinja2)
          and reflects user-supplied input in rendered output.
          Further testing required to confirm exploitability.

directories:
  - path: "/"
    status: 200
    notes: "GET /?name=World returns 'Hello World!' — accepts user input via query parameter"

quick_wins:
  - vector: "Potential SSTI in web application"
    reason: "Template engine detected with user-controllable input reflected in output"
    priority: 1
